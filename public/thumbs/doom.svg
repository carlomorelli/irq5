<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="DOOM shareware">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffb000" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <radialGradient id="heat" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#2a1400"/>
      <stop offset=".55" stop-color="#0b0703"/>
      <stop offset="1" stop-color="#030403"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="480" fill="url(#heat)"/>
  <rect width="640" height="480" fill="url(#grid)"/>
  <g fill="none" stroke="#ffb000" stroke-width="2" opacity=".55">
    <path d="M24 54V24h30"/>
    <path d="M586 24h30v30"/>
    <path d="M24 426v30h30"/>
    <path d="M616 426v30h-30"/>
  </g>
  <text x="320" y="246" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="128" font-weight="700" letter-spacing="10" fill="#ffb000" filter="url(#glow)">DOOM</text>
  <text x="320" y="296" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="23" letter-spacing="12" fill="#39ff88">SHAREWARE</text>
  <text x="320" y="330" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="4" fill="#8c9784">KNEE-DEEP IN THE DEAD</text>
  <rect x="32" y="382" width="576" height="1" fill="#253020"/>
  <text x="32" y="412" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="3" fill="#8c9784">E1M1 · HANGAR</text>
  <text x="608" y="412" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="3" fill="#ffb000">IRQ 5</text>
  <g fill="#39ff88">
    <rect x="32" y="432" width="46" height="4"/>
    <rect x="84" y="432" width="18" height="4" opacity=".45"/>
    <rect x="108" y="432" width="8" height="4" opacity=".25"/>
  </g>
</svg>
