<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Street Fighter II">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a2e"/>
      <stop offset="1" stop-color="#1a0033"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <g opacity=".3">
    <polygon points="0,240 160,0 480,0 640,240 480,480 160,480" fill="none" stroke="#ff3366"/>
  </g>
  <text x="320" y="220" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="64" font-weight="700" letter-spacing="6" fill="#ff3366" filter="url(#glow)">STREET</text>
  <text x="320" y="280" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="64" font-weight="700" letter-spacing="6" fill="#33ccff" filter="url(#glow)">FIGHTER</text>
  <text x="320" y="340" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="58" font-weight="700" letter-spacing="16" fill="#ffcc33">II</text>
  <text x="320" y="390" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="10" fill="#cc99ff">CAPCOM</text>
</svg>
